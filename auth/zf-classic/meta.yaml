# 正方教务 · 经典版
# 已实测：2026-11-21，福建农林大学 jwgl.fafu.edu.cn，AI 现场登录成功并跳到 xs_main.aspx

auth_id: "zf-classic"
auth_name: "正方教务（经典版）"
asset_js_path: "login.js"
captcha: "image"
verified: true
verified_on: "2026-11-21"
verified_school: "福建农林大学"
maintainer: "Nexio课程表"

# 用来把学校自动挂到登录器上；三项全中才算
match:
  url_contains: ["default2.aspx", "default.aspx"]
  dom_has: ["#txtUserName", "#TextBox2"]
  title_contains: ["正方教务"]

notes: |
  - 会话 ID 在 URL 路径里：/(a1b2c3d4)/default2.aspx，每次访问都会重新生成。
    所有 URL 都要从 location 动态取前缀，写死必然失效。
  - 验证码图片是 #icode，src 指向 CheckCode.aspx，点它会执行 reloadcode() 换图。
  - 身份单选 RadioButtonList1 四个值：部门 / 教师 / 学生 / 访客，学生是 #RadioButtonList1_2 且默认选中。
  - 登录成功跳 /(sid)/xs_main.aspx?xh=学号，正文出现「欢迎您：xxx同学」。
  - 提交失败时是 alert 脚本 + 停在登录页，DOM 里通常没有可见错误文案。
