# 强智科技教务
# ⚠ 尚未实测，login.js 是待补骨架。别标 verified: true。

auth_id: "qz-default"
auth_name: "强智科技教务"
asset_js_path: "login.js"
captcha: "image"
verified: false
maintainer: "Nexio课程表"

match:
  url_contains: ["loginToXk", "xk.zzuli", "/jsxsd/"]
  dom_has: ["#yhm", "#mm"]
  title_contains: ["强智", "教学一体化"]

notes: |
  - 常见入口 /loginToXk 或 /jsxsd/，账号 #yhm、密码 #mm、验证码 #yzm（部分学校叫 #RANDOMCODE）。
  - 大量强智部署带图片验证码，且**连续错 3 次会锁账号几分钟** —— 重试要克制。
  - 待办：找一所强智学校实测 selector 与成功判定（通常是跳 /framework/xsMain.jsp）。
